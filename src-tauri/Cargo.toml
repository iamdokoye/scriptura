[package]
name = "scriptura"
version = "0.1.7"
description = "Scriptura — desktop Bible study app"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.78"

# Dev builds: opt-level 2 gives ~80% of release speed with fast incremental compiles.
# This is what `tauri dev` uses — makes the app feel responsive during development.
[profile.dev]
opt-level = 2

# Release builds: maximum optimisation. Larger binary, much faster runtime.
# LTO=fat lets the compiler inline across crate boundaries (zlib, SQLite, XML parser).
# panic=unwind (the default) is kept explicit here: it costs a little size/speed
# over abort, but it means a panic anywhere terminates that one operation instead
# of instantly killing the whole app with no diagnostics — see the panic hook in
# lib.rs, which relies on unwinding to run before the process exits.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[lib]
name = "scriptura_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "scriptura"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
flate2 = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
zip = "2"
walkdir = "2"
regex = "1"
once_cell = "1"
tar = "0.4"
thiserror = "1"
log = "0.4"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
